<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="260" viewBox="0 0 1280 260" role="img" aria-label="AI SVG Animator pipeline"><defs><linearGradient id="bg" x1="0" y1="0" x2="1280" y2="260" gradientUnits="userSpaceOnUse"><stop stop-color="#08111F"/><stop offset="1" stop-color="#0B1C36"/></linearGradient><style>.t{font:700 26px Inter,Segoe UI,Arial,sans-serif}.k{font:600 14px Inter,Segoe UI,Arial,sans-serif;letter-spacing:.18em}.b{font:400 14px Inter,Segoe UI,Arial,sans-serif}</style></defs><rect width="1280" height="260" rx="24" fill="url(#bg)"/><text x="48" y="42" fill="#CFE0FF" class="k">HOW IT WORKS</text><text x="48" y="76" fill="#FFF" class="t">From prompt to web-ready motion</text><g><rect x="48" y="108" width="250" height="108" rx="18" fill="#0B162A" stroke="#2E4C79"/><text x="72" y="138" fill="#8FB1E7" class="k">STEP 01</text><text x="72" y="165" fill="#FFF" class="b">Prompt or SVG input</text><text x="72" y="190" fill="#C7D9FB" class="b">Describe an idea or bring your own SVG.</text></g><path d="M316 162H356" stroke="#4D86FF" stroke-width="4" stroke-linecap="round"/><path d="M348 153L358 162L348 171" stroke="#4D86FF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g><rect x="376" y="108" width="250" height="108" rx="18" fill="#0B162A" stroke="#2E4C79"/><text x="400" y="138" fill="#8FB1E7" class="k">STEP 02</text><text x="400" y="165" fill="#FFF" class="b">Generate and clean SVG</text><text x="400" y="190" fill="#C7D9FB" class="b">Create a vector and normalize it.</text></g><path d="M644 162H684" stroke="#4D86FF" stroke-width="4" stroke-linecap="round"/><path d="M676 153L686 162L676 171" stroke="#4D86FF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g><rect x="704" y="108" width="250" height="108" rx="18" fill="#0B162A" stroke="#2E4C79"/><text x="728" y="138" fill="#8FB1E7" class="k">STEP 03</text><text x="728" y="165" fill="#FFF" class="b">Apply motion</text><text x="728" y="190" fill="#C7D9FB" class="b">Use presets or an AI motion plan.</text></g><path d="M972 162H1012" stroke="#4D86FF" stroke-width="4" stroke-linecap="round"/><path d="M1004 153L1014 162L1004 171" stroke="#4D86FF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g><rect x="1032" y="108" width="200" height="108" rx="18" fill="#0B162A" stroke="#2E4C79"/><text x="1056" y="138" fill="#8FB1E7" class="k">STEP 04</text><text x="1056" y="165" fill="#FFF" class="b">Preview and export</text><text x="1056" y="190" fill="#C7D9FB" class="b">See it live and ship it.</text></g></svg>