name: Smoke Deployed App

on:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check app and API
        shell: bash
        run: |
          set -euo pipefail
          APP_URL="https://ai-svg-animator.lizard-marten.workers.dev"
          echo "Checking $APP_URL"
          curl --fail --show-error --silent "$APP_URL/" | grep -qi "AI SVG Animator"
          curl --fail --show-error --silent "$APP_URL/api/ai/models" | tee /tmp/models.json
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/models.json','utf8'));if(!Array.isArray(j.selectable))process.exit(1);console.log('models endpoint OK:',j.selectable.map(x=>x.id).join(', '))"
