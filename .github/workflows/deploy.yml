name: Deploy Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN repository secret is not configured"
            exit 1
          fi
          echo "Cloudflare credentials are configured"

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Configure B.AI Worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BAI_API_KEY: ${{ secrets.BAI_API_KEY }}
        shell: bash
        run: |
          if [ -z "$BAI_API_KEY" ]; then
            echo "::warning::BAI_API_KEY repository secret is not configured; B.AI routes will be unavailable"
            exit 0
          fi
          printf '%s' "$BAI_API_KEY" | npx wrangler secret put BAI_API_KEY
          echo "B.AI Worker secret configured"

      - name: Smoke-test production AI backend
        continue-on-error: true
        shell: bash
        run: |
          set -u
          APP_URL="https://ai-svg-animator.conradipui.workers.dev"
          echo "Health:"
          curl --retry 4 --retry-delay 2 --fail-with-body --show-error --silent "$APP_URL/api/ai/health" || true
          echo
          echo "Motion route:"
          status=$(curl --retry 3 --retry-delay 2 --show-error --silent \
            -o /tmp/motion-smoke.json -w '%{http_code}' \
            -X POST "$APP_URL/api/ai/motion" \
            -H 'content-type: application/json' \
            --data '{"model":"glm-5.3-flash","prompt":"Return a Motion Spec v1 JSON object only. Allowed target: #demo. Create one subtle translate track for #demo."}')
          cat /tmp/motion-smoke.json
          echo
          echo "HTTP $status"
          if [ "$status" != "200" ]; then
            exit 1
          fi
